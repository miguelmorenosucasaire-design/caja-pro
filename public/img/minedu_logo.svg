<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <!-- Icono de barras Minedu -->
  <g fill="#1d4ed8">
    <!-- 3 Barras Verticales Escalonadas -->
    <rect x="15" y="72" width="22" height="48" rx="2" />
    <rect x="42" y="42" width="22" height="78" rx="2" />
    <rect x="69" y="12" width="22" height="108" rx="2" />
    
    <!-- 3 Barras Horizontales Escalonadas -->
    <rect x="97" y="12" width="52" height="30" rx="2" />
    <rect x="97" y="48" width="76" height="30" rx="2" />
    <rect x="97" y="84" width="102" height="36" rx="2" />
  </g>

  <!-- Línea divisoria superior del texto -->
  <line x1="12" y1="128" x2="205" y2="128" stroke="#1d4ed8" stroke-width="1.8" />

  <!-- Texto Ministerio de Educación -->
  <text x="108" y="145" font-family="'Times New Roman', serif" font-size="14.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    Ministerio de Educación
  </text>
  
  <!-- Texto REPÚBLICA DEL PERÚ -->
  <text x="108" y="159" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" letter-spacing="2" fill="#1d4ed8" text-anchor="middle">
    REPÚBLICA DEL PERÚ
  </text>

  <!-- Línea divisoria inferior -->
  <line x1="12" y1="168" x2="205" y2="168" stroke="#1d4ed8" stroke-width="1.8" />
</svg>
